[project]
name = "puray"
version = "0.2.0"
description = "GPU-accelerated Pure Python Raytracer for NVIDIA Blackwell (GB10)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "numba>=0.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
puray = "main:main"
puray-gpu = "main_gpu:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
